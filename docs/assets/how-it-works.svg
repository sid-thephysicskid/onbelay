<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img" aria-labelledby="t d">
  <title id="t">What the guard does</title>
  <desc id="d">Ordinary commands run untouched. A force push to main is refused, and the refusal names the command that does the same job safely.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 17px; }
      .ui   { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .dim  { fill: #7d8590; }
      .cmd  { fill: #e6edf3; }
      .ok   { fill: #3fb950; }
      .no   { fill: #f85149; }
      .hint { fill: #d29922; }
    </style>
  </defs>

  <rect width="900" height="372" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <circle cx="30" cy="30" r="6" fill="#ff5f57"/>
  <circle cx="52" cy="30" r="6" fill="#febc2e"/>
  <circle cx="74" cy="30" r="6" fill="#28c840"/>
  <text x="104" y="35" class="ui dim" font-size="14" font-weight="600">your coding agent, working</text>
  <line x1="0" y1="56" x2="900" y2="56" stroke="#30363d" stroke-width="1.5"/>

  <text x="32" y="104" class="mono"><tspan class="dim">$</tspan><tspan class="cmd" dx="10">git push origin my-feature</tspan></text>
  <text x="868" y="104" class="mono ok" text-anchor="end" font-size="15">runs</text>

  <text x="32" y="142" class="mono"><tspan class="dim">$</tspan><tspan class="cmd" dx="10">rm -rf node_modules</tspan></text>
  <text x="868" y="142" class="mono ok" text-anchor="end" font-size="15">runs</text>

  <text x="32" y="180" class="mono"><tspan class="dim">$</tspan><tspan class="cmd" dx="10">psql -h localhost -c 'select 1'</tspan></text>
  <text x="868" y="180" class="mono ok" text-anchor="end" font-size="15">runs</text>

  <line x1="32" y1="206" x2="868" y2="206" stroke="#21262d" stroke-width="1.5"/>

  <text x="32" y="248" class="mono"><tspan class="dim">$</tspan><tspan class="cmd" dx="10">git push --force origin main</tspan></text>
  <text x="868" y="248" class="mono no" text-anchor="end" font-size="15">stopped</text>

  <rect x="32" y="268" width="836" height="76" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5" stroke-opacity="0.45"/>
  <text x="52" y="298" class="mono no" font-size="16">BLOCKED: force push.</text>
  <text x="52" y="326" class="mono" font-size="16"><tspan class="hint">Do this instead:</tspan><tspan class="cmd" dx="8">git push --force-with-lease</tspan><tspan class="dim" dx="8">on your own PR branch</tspan></text>
</svg>
